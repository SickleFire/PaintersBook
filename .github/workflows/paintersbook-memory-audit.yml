name: Memory Audit Example (PaintersBook)

# Manually triggerable, plus runs on pushes to main so the badge/report
# stays fresh as a living demo of the mvis action.
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  memory-audit:
    # PaintersBook links opengl32/gdi32 directly and has no CMake setup —
    # it's a Windows-only build. windows-latest also gives us a real desktop
    # session, which GLFW needs to create a window (a Linux runner would
    # need Xvfb for this to even launch).
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW (g++)
        run: choco install mingw -y

      - name: Build PaintersBook
        shell: cmd
        run: build.bat

      - name: Run mvis memory audit
        id: audit
        uses: SickleFire/m-vis@v0.5.0-rc1
        with:
          version: v0.5.0-rc1
          # PaintersBook is an interactive render loop and never exits on
          # its own, so `duration` is what tells mvis how long to watch
          # before it stops the process and reports.
          spawn: build/main.exe
          max-memory: 512
          duration: 30
          format: junit
          output: paintersbook-report.xml

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paintersbook-memory-report
          path: paintersbook-report.xml